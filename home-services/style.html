<style>
/* Homepage services (akaru.fr "Expertises" layout): six full-screen panels in brand colours. Desktop: the stage pins and
   each panel slides in from the right over the last, the next two waiting as narrowing strips, every panel's video
   sized to its strip; heading, text and progress stay put while the panels wipe across them (services-xp.js).
   Phones, tablets and reduced motion: the panels stack as cards. Type = the site's: the heading carries the site's
   section-title classes (h1 for-h2), titles and lists match the Services page panels, labels use its mono. */
.sx{--sx-ar:1.4286;--sx-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;position:relative;background:#1A232D;color:#fff;
  font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.sx,.sx *{box-sizing:border-box}
.sx-panel{position:relative;background:var(--sx-bg);color:var(--sx-ink)}
.sx .sx-head{margin:0;max-width:none;padding:0;font-weight:600;color:inherit;white-space:nowrap}
.sx-head-v{display:inline-block}
.sx-cw{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
.sx-c{display:inline-block}
.sx.sx-split .sx-c{transform:translate3d(0,108%,0);transition:transform .9s cubic-bezier(.22,1,.36,1) calc(var(--i)*45ms)}
.sx.sx-split.is-in .sx-c{transform:none}
.sx-index{font:500 11px/1.3 var(--sx-mono);letter-spacing:.16em;color:var(--sx-ink)}
.sx-title{margin:0;font:500 clamp(1.6rem,2.6vw,2.3rem)/1.3 Inter,sans-serif;letter-spacing:-.02em;color:var(--sx-ink);text-wrap:balance}
.sx-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,max-content);gap:.5em 1.6em;
  font:500 1.04rem/1.3 Inter,sans-serif;letter-spacing:-.01em}
.sx-list li{position:relative;margin:0;padding:0 0 0 1.1em;font:inherit;line-height:inherit;letter-spacing:inherit;opacity:1;color:var(--sx-ink);text-wrap:balance}   /* the theme sizes and dims every <li> */
.sx-list li::before{content:"+";content:"+" / "";position:absolute;left:0;top:0;color:var(--sx-ink2)}
/* Learn more = the Services page button (services-section.js makeButton, built by services-xp.js), in each panel's ink */
.sx-cta{display:inline-block;padding:8px 0 10px;font:500 1rem/1.3 Inter,sans-serif;letter-spacing:-.5px;color:var(--sx-ink);
  text-decoration:none;border-bottom:1px solid var(--sx-line)}
.sx .button_wrapper{--run:28px;--arrow-gap:10px;--inset-min:8px;position:relative;display:inline-block}
.sx .button_wrapper .btn{position:relative;display:block;text-decoration:none;color:var(--sx-ink);font-family:"Inter",Helvetica,Arial,system-ui,sans-serif;
  font-weight:500;text-transform:none;letter-spacing:-.5px;font-size:1rem;line-height:1.3;padding:8px 0 10px;width:15rem;overflow:hidden;cursor:pointer}
.sx .button_wrapper .word{display:inline-flex;transform:translate(0);position:relative;z-index:1}
.sx .button_wrapper .text{display:inline-block;white-space:pre;transition-property:transform;transition-duration:var(--dur,300ms);
  transition-timing-function:ease;transition-delay:var(--delay,0s);transform:translate(0)}
.sx .button_wrapper.is-hovered .text{transform:translateX(var(--group-move,0px))}
.sx .button_wrapper .arrow{position:absolute;top:50%;transform:translateY(-50%);width:20px;height:1em;overflow:hidden}
.sx .button_wrapper .arrow.arrow-right{right:2px}
.sx .button_wrapper .arrow.arrow-left{left:0}
.sx .button_wrapper .arrow-sprite{display:inline-block;will-change:transform,opacity}
.sx .button_wrapper .u-right,.sx .button_wrapper .u-left{position:absolute;left:0;bottom:2px;height:1px;width:100%}
.sx .button_wrapper .u-right{background:var(--sx-line)}
.sx .button_wrapper .u-left{background:var(--sx-accent)}
.sx .button_wrapper .btn:focus-visible{outline:2px solid var(--sx-ink);outline-offset:3px}
.sx-media{position:relative;overflow:hidden;aspect-ratio:var(--sx-ar);background:rgba(0,0,0,.12)}
.sx-media video{display:block;width:100%;height:100%;max-width:none;object-fit:cover}
.sx-copy,.sx-nav{display:none}
/* stacked cards (phones, tablets, reduced motion): each card sticks as the next one slides up over it; its top band is as
   tall as the site header (--sx-hh, measured by the script), so the header always sits on the card colour */
.sx{padding-top:clamp(72px,12vh,120px)}
.sx-stage>.sx-head{padding:0 16px clamp(24px,5vw,40px)}
.sx-panel{position:sticky;top:0;padding:var(--sx-hh,64px) 12px 36px}
.sx-inner{display:flex;flex-direction:column}
.sx-media{order:-1;width:100%;max-height:38svh}
.sx-content{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;padding:22px 6px 0}
.sx-index{grid-row:1;align-self:center}
.sx-title,.sx-list,.sx-cta,.sx-content>.button_wrapper{grid-column:2}
.sx-list{margin:14px 0 18px}
.sx-cta,.sx-content>.button_wrapper{justify-self:start}
@media (min-width:600px){.sx-panel{padding:var(--sx-hh,72px) 16px 44px}.sx-list{grid-template-columns:repeat(2,minmax(0,max-content))}}
@media (min-width:992px){
  .sx-inner{flex-direction:row;align-items:center;gap:5vw;padding:5vw 6vw}
  .sx-media{order:0;width:42%;flex:0 0 42%}
  .sx-content{flex:1}
}
@media (prefers-reduced-motion:reduce){.sx-panel{position:relative}.sx.sx-split .sx-c{transform:none;transition:none}}
/* pinned horizontal panels (desktop) */
@media (min-width:992px) and (prefers-reduced-motion:no-preference){
  .sx{padding-top:0}
  .sx-pin{height:calc(100vh + 5 * 110vh + 20vh)}
  .sx-stage{position:sticky;top:0;height:100vh;overflow:hidden;overflow:clip}
  .sx-panels{position:absolute;inset:0}
  .sx-panel{position:absolute;inset:0;padding:0;overflow:hidden;will-change:transform}
  .sx-panel:nth-child(2){transform:translate3d(80%,0,0)}
  .sx-panel:nth-child(3){transform:translate3d(95%,0,0)}
  .sx-panel:nth-child(n+4){transform:translate3d(100%,0,0)}
  .sx-inner{position:absolute;inset:0;display:block;padding:0;will-change:transform}
  .sx-stage>.sx-head,.sx .sx-copy.sx-head{position:absolute;z-index:3;left:var(--sx-gx,11.11vw);top:var(--sx-ht,12vh);color:#0F0E0E}
  .sx .sx-copy.sx-head{z-index:auto;color:var(--sx-ink)}
  .sx-content{position:absolute;left:var(--sx-gx,11.11vw);top:var(--sx-ct,calc(81.4vh - 23.33vw));width:var(--sx-cw,32vw);display:block;padding:0}
  .sx-index{display:none}
  .sx-list{margin:1.4em 0 2.2em;grid-template-columns:minmax(0,max-content)}
  .sx-media{position:absolute;left:0;top:0;width:var(--sx-iw,33.333vw);max-height:none;flex:none;transform-origin:0 0;will-change:transform;
    transform:translate3d(46.667vw,calc(81.4vh - 23.33vw),0)}
  .sx-nav{position:absolute;z-index:3;left:var(--sx-gx,11.11vw);right:var(--sx-gx,11.11vw);top:var(--sx-nt,91.9vh);display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));font:500 11px/1.3 var(--sx-mono);letter-spacing:.16em;text-transform:uppercase;color:#0F0E0E}
  .sx-copy.sx-nav{z-index:auto;color:var(--sx-ink)}
  .sx-nav-i{display:flex;gap:1.6em;white-space:nowrap;overflow:hidden}
  .sx-nav-t{opacity:0;transition:opacity .35s ease}
  .sx-nav-t.on{opacity:1}
  .sx-nav-bar{position:absolute;left:0;right:0;top:calc(100% + 1.9em);height:1px;overflow:hidden}
  .sx-nav-bar span{position:absolute;inset:0;background:currentColor;transform-origin:0 50%;transform:scaleX(.1667)}
  .sx-live .sx-copy{display:block}
  .sx-live .sx-copy.sx-nav{display:grid}
  .sx-live .sx-stage>.sx-nav{display:none}
  .sx-live .sx-stage>.sx-head{width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  .sx-live .sx-peek{cursor:pointer}
}
/* the site header over light panels: dark logo and menu lines (set by services-xp.js while a light panel is under them) */
html.sx-cover .blur-effect{visibility:hidden}   /* its backdrop blur smears the strip edges behind the header */
html.sx-logo-dark .navigation-top .logo-first{filter:brightness(0)}
html.sx-menu-dark .navigation-top .hamburger-flex:not(.cy-burger-open) .hamburger-line{background-color:#0F0E0E}
.navigation-top .hamburger-line{transition:transform .4s cubic-bezier(.4,0,.2,1),background-color .25s ease}
</style>
