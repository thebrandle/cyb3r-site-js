<style>
/* Service page "3" pairs (bennettandclive.com clients list): two columns of what the service covers,
   meeting at the centre; the CYB3R 3 rides the middle of the screen and the rows part around it as the
   page scrolls. Behaviour: hosted service-pairs.js. --bp-lh = row height, --bp-mh = height of the 3. */
.bp{--bp-bg:#1A232D;--bp-ink:#fff;--bp-accent:#39F1E0;--bp-lh:1.16;--bp-mh:1.3em;position:relative;overflow:hidden;overflow:clip;
  background:var(--bp-bg);color:var(--bp-ink);padding:clamp(72px,14vh,160px) 0 clamp(40px,8vh,96px);font-family:Inter,sans-serif;
  -webkit-font-smoothing:antialiased}
.bp,.bp *{box-sizing:border-box}
.bp-wrap{position:relative;font-size:3.125vw;line-height:var(--bp-lh);letter-spacing:-.04em}
.bp-list{list-style:none;margin:0;padding:0}
.bp-row{display:flex;justify-content:center;column-gap:1.4vw;white-space:nowrap;margin:0;padding:0;
  font-size:inherit;line-height:inherit;font-weight:inherit;letter-spacing:inherit;opacity:1}   /* the theme sizes and dims every <li> */
.bp-l,.bp-r{flex:0 0 50%;font-weight:300;letter-spacing:-.03em;will-change:transform}
.bp-l{text-align:right}
.bp .bp-b{font-weight:700;letter-spacing:-.04em}
/* the 3 travels between the first and last row centres, held at the middle of the screen in between */
.bp-track{position:absolute;left:0;right:0;top:calc(var(--bp-lh)*.5em - var(--bp-mh)/2);bottom:calc(var(--bp-lh)*.5em - var(--bp-mh)/2);
  pointer-events:none}
.bp-mark{position:sticky;top:calc(50vh - var(--bp-mh)/2);display:block;width:calc(var(--bp-mh)*.804);height:var(--bp-mh);margin:0 auto;
  color:var(--bp-accent)}
.bp-mark svg{display:block;width:100%;height:100%}
.bp.bp-pre .bp-mark{visibility:hidden}
/* "View all" under the list: same side padding as the site's sections, the link itself keeps the site classes */
.bp-more{padding:0 2% 50px}
@media (max-width:767px){.bp{--bp-mh:1.45em}.bp-wrap{font-size:4.4vw}.bp-row{column-gap:3vw}}
@media (prefers-reduced-motion:reduce){.bp-track{display:none}}
</style>
