<style>
/* Service page "3" pairs (bennettandclive.com clients list): two columns of what the service covers,
   meeting at the centre; the CYB3R 3 rides the middle of the screen and the rows part around it as the
   page scrolls. Behaviour: hosted service-pairs.js. */
.bp{--bp-bg:#1A232D;--bp-ink:#fff;--bp-accent:#39F1E0;position:relative;overflow:hidden;overflow:clip;background:var(--bp-bg);
  color:var(--bp-ink);padding:clamp(72px,14vh,160px) 0;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.bp,.bp *{box-sizing:border-box}
.bp-wrap{position:relative;font-size:3.125vw;line-height:.95;letter-spacing:-.05em}
.bp-list{list-style:none;margin:0;padding:0}
.bp-row{display:flex;justify-content:center;column-gap:.52vw;white-space:nowrap;margin:0;padding:0;
  font-size:inherit;line-height:inherit;font-weight:inherit;letter-spacing:inherit;opacity:1}   /* the theme sizes and dims every <li> */
.bp-l,.bp-r{flex:0 0 50%;font-weight:300;letter-spacing:-.04em;will-change:transform}
.bp-l{text-align:right}
.bp .bp-b{font-weight:700;letter-spacing:-.05em}
/* the 3 travels between the first and last row centres, held at the middle of the screen in between */
.bp-track{position:absolute;left:0;right:0;top:.025em;bottom:.025em;pointer-events:none}
.bp-mark{position:sticky;top:calc(50vh - .45em);display:block;width:.724em;height:.9em;margin:0 auto;color:var(--bp-accent)}
.bp-mark svg{display:block;width:100%;height:100%}
.bp.bp-pre .bp-mark{visibility:hidden}
@media (min-width:1920px){.bp-row{column-gap:1rem}}
@media (max-width:767px){.bp-wrap{font-size:4.4vw}.bp-row{column-gap:1.6vw}}
@media (prefers-reduced-motion:reduce){.bp-track{display:none}}
</style>
